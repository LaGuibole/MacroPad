services:
  app:
    build:
      context: . 
      dockerfile: docker/node/Dockerfile
    
    ports:
      - "5173:5173"

    volumes:
      - .:/MacroPadApp
      - /MacroPadApp/node_modules
    environment:
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
    
    stdin_open: true
    tty: true
